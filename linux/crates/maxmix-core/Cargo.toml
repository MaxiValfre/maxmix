[package]
name = "maxmix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MaxMix orchestration core: slot mapping, feedback guard, settings, event->action logic."

[dependencies]
maxmix-protocol = { path = "../maxmix-protocol" }
maxmix-audio = { path = "../maxmix-audio", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
