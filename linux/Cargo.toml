[workspace]
resolver = "2"
members = [
    "crates/maxmix-protocol",
    "crates/maxmix-serial",
    "crates/maxmix-audio",
    "crates/maxmix-core",
    "crates/maxmix-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MaxiValfre/maxmix"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
